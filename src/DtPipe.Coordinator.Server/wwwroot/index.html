<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dtpipe coordinator</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="app.css">
</head>
<body class="app">
  <div id="trial-banner" class="trial-banner" role="alert" hidden>Trial identity provider: anyone who knows the trial password signs in as any user. Not for production.</div>
  <header class="topbar">
    <div class="brand">dtpipe <span>coordinator</span></div>
    <nav class="nav" id="nav">
      <a href="#/nodes" data-view="nodes">Nodes</a>
      <a href="#/library" data-view="library">Library</a>
      <a href="#/runs" data-view="runs">Runs</a>
      <a href="#/access" data-view="access">Access</a>
      <a href="lab/" class="external" id="lab-link" hidden title="Lab mode: cut branches, place them by hand, inject faults">Lab ↗</a>
    </nav>
    <div class="status">
      <span id="conn" class="pill off">disconnected</span>
      <span id="nodes-pill" class="pill">0 nodes</span>
      <span id="runs-pill" class="pill">no run</span>
      <span id="bytes" class="pill mono">hub 0 B</span>
      <span id="me" class="pill" title="Signed in through the identity provider; the roles are this coordinator's"></span>
      <a href="/account/logout" class="pill">Sign out</a>
    </div>
  </header>
  <main id="view" class="view"></main>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
