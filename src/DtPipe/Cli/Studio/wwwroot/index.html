<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dtpipe studio</title>
  <link rel="stylesheet" href="/studio.css">
</head>
<body>
  <header>
    <b>dtpipe studio</b>
    <span id="folder" class="muted"></span>
    <span id="job-name" class="mono"></span>
    <span id="status" class="pill"></span>
    <button id="quit" class="ghost">Quit</button>
  </header>
  <main>
    <aside class="jobs-pane">
      <h2>Jobs</h2>
      <ul id="jobs"></ul>
    </aside>
    <section id="designer" class="designer">
      <p class="muted intro">Open a job on the left. It opens as cards: its sources, its steps and its sinks. A sample
        runs it through the real engine over the first source rows, with the writer neutralised: the target is never
        written.</p>
    </section>
  </main>
  <script type="module" src="/studio.js"></script>
</body>
</html>
