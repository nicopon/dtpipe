<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dtpipe studio</title>
  <link rel="stylesheet" href="/studio.css">
</head>
<body>
  <header>
    <b>dtpipe studio</b>
    <span id="folder" class="muted"></span>
    <span id="status" class="pill"></span>
    <button id="quit" class="ghost">Quit</button>
  </header>
  <main>
    <aside>
      <h2>Jobs</h2>
      <ul id="jobs"></ul>
    </aside>
    <section class="work">
      <div class="bar">
        <span id="job-name" class="muted">No job open</span>
        <label>source rows <input id="rows" type="number" min="1" max="1000" value="20"></label>
        <button id="sample" class="primary" title="Ctrl+Enter">Sample</button>
      </div>
      <textarea id="yaml" spellcheck="false" placeholder="Open a job on the left, or write one here."></textarea>
      <div id="results">
        <p class="muted">A sample runs the job through the real engine over the first source rows, with the
          writer neutralised: nothing is written. Each stage shows the rows it passed.</p>
      </div>
    </section>
  </main>
  <script type="module" src="/studio.js"></script>
</body>
</html>
