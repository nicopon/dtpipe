# Revenue by country, category and month
# Three source bricks on three nodes, joined on the runner, loaded into the warehouse.
# lab-check: SELECT count(*) AS n, sum(orders) AS orders, round(sum(revenue), 2) AS revenue FROM revenue_by_country
orders:
  input: brick:node-2/orders-billable
customers:
  input: brick:node-1/customer-countries
products:
  input: brick:node-3/products
revenue:
  from: orders
  ref:
  - customers
  - products
  provider-options:
    sql:
      query: |-
        SELECT c.country, p.category, date_trunc('month', o.order_date) AS month,
        COUNT(*) AS orders, SUM(o.quantity * p.unit_price) AS revenue
        FROM orders o
        JOIN customers c ON c.customer_id = o.customer_id
        JOIN products p ON p.product_id = o.product_id
        GROUP BY ALL
load:
  from: revenue
  output: brick:node-4/revenue-by-country
