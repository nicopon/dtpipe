# Slow sensor stream
# 300,000 readings generated on node-1 at 10,000 rows/s (about 30 s), enriched with the customers'
# country on the runner, loaded into the warehouse. Long enough to watch a run, or to cancel it.
# lab-check: SELECT count(*) AS n, sum(reading_id) AS ids, round(sum(value), 1) AS total FROM sensor_readings
readings:
  input: brick:node-1/sensor-feed
customers:
  input: brick:node-1/customer-countries
enrich:
  from: readings
  ref:
  - customers
  provider-options:
    sql:
      query: |-
        SELECT r.GenerateIndex AS reading_id, c.country, (r.GenerateIndex * 37) % 1000 / 10.0 AS value
        FROM readings r JOIN customers c ON c.customer_id = 1 + r.GenerateIndex % 20000
load:
  from: enrich
  output: brick:node-4/sensor-readings
