# Customers mirrored into the warehouse
# A source brick wired straight into a sink brick: nothing happens in between, so the rows go
# from the CRM to the warehouse directly, without a runner. Upserted on customer_id.
# lab-check: SELECT count(*) AS n, sum(customer_id) AS ids, count(DISTINCT email) AS emails FROM customers_mirror
customers:
  input: brick:node-1/customers
mirror:
  from: customers
  output: brick:node-4/customers-mirror
