# Order history: current orders merged with the archive
# Two bricks that already cast to the archive schema, merged on the runner.
# lab-check: SELECT count(*) AS n, sum(order_id) AS ids, count(DISTINCT order_date) AS days FROM fact_orders
current:
  input: brick:node-2/orders-history
legacy:
  input: brick:node-3/legacy-orders
history:
  from: current,legacy
  provider-options:
    merge: {}
load:
  from: history
  output: brick:node-4/fact-orders
