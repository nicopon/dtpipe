# Customers, anonymized on the runner
# One branch reads the CRM, a second anonymizes it (seeded fakes for the personal columns, the first
# name dropped), a third loads the warehouse. The read stays on node-1, the anonymizing goes to the
# runner, the load to node-4. A data node only reads and writes, so the personal columns do leave the
# CRM (crm -> runner) and are replaced before they reach the warehouse.
# lab-place: crm=node-1, customers=runner-1, dim=node-4
# lab-check: SELECT count(*) AS n, count(DISTINCT email) AS emails, sum(hash(email) % 1000003) AS email_sum, sum(customer_id) AS ids FROM dim_customers
crm:
  input: sqlite:${{LAB_CRM_DB}}
  provider-options:
    sqlite-reader:
      query: SELECT customer_id, first_name, last_name, email, city, country, signup_date FROM customers
customers:
  from: crm
  transformers:
  - type: fake
    mappings:
      last_name: name.lastName
      email: internet.email
    options:
      seed-column: customer_id
  - type: project
    options:
      drop: first_name
dim:
  from: customers
  output: duck:${{LAB_WAREHOUSE_DB}}
  provider-options:
    duck-writer:
      table: dim_customers
      strategy: Recreate
