# Customers, anonymized before they leave the CRM
# One linear branch: read the CRM, replace the personal columns with seeded fakes, drop the first
# name, load the warehouse. Cut after the project stage and place the head on node-1: the
# personal data never crosses the network, only the anonymized rows do.
# lab-cut: customers@2
# lab-check: SELECT count(*) AS n, count(DISTINCT email) AS emails, sum(hash(email) % 1000003) AS email_sum, sum(customer_id) AS ids FROM dim_customers
customers:
  input: sqlite:${{LAB_CRM_DB}}
  transformers:
  - type: fake
    mappings:
      last_name: name.lastName
      email: internet.email
    options:
      seed-column: customer_id
  - type: project
    options:
      drop: first_name
  output: duck:${{LAB_WAREHOUSE_DB}}
  provider-options:
    sqlite-reader:
      query: SELECT customer_id, first_name, last_name, email, city, country, signup_date FROM customers
    duck-writer:
      table: dim_customers
      strategy: Recreate
