# Order history: current orders merged with the archive
# UNION ALL of the current orders (DuckDB, node-2) and the archived ones (SQLite, node-3). The
# two engines disagree on integer widths and on dates, and dtpipe never converts silently: each
# source query casts to the shared schema itself.
# lab-check: SELECT count(*) AS n, sum(order_id) AS ids, count(DISTINCT order_date) AS days FROM fact_orders
current:
  input: duck:${{LAB_SALES_DB}}
  provider-options:
    duck-reader:
      query: >-
        SELECT CAST(order_id AS BIGINT) AS order_id, CAST(customer_id AS BIGINT) AS customer_id,
        CAST(product_id AS BIGINT) AS product_id, CAST(quantity AS BIGINT) AS quantity,
        CAST(order_date AS VARCHAR) AS order_date, status
        FROM orders
legacy:
  input: sqlite:${{LAB_CATALOG_DB}}
  provider-options:
    sqlite-reader:
      query: >-
        SELECT order_id, customer_id, product_id, quantity, date(order_date) AS order_date, status
        FROM legacy_orders
history:
  from: current,legacy
  output: duck:${{LAB_WAREHOUSE_DB}}
  provider-options:
    merge: {}
    duck-writer:
      table: fact_orders
      strategy: Recreate
