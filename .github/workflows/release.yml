name: Release

on:
  push:
    tags:
      - 'v*'
  # Builds the images of the distributed pipeline's two hosts without publishing them: a loadable tarball per image and architecture.
  # Run by hand, the workflow builds the images and keeps them as artifacts. With publish, it pushes them to GHCR under the
  # one tag given, never latest, major.minor or a release version, so a trial of the push path needs no v tag.
  workflow_dispatch:
    inputs:
      publish:
        description: Push the images to GHCR instead of keeping them as artifacts
        type: boolean
        default: false
      tag:
        description: Image tag to publish under (publish only), for example edge or 1.11.0-rc.1
        type: string
        default: ''

jobs:
  build:
    name: Build ${{ matrix.platform }}
    if: github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            rid: linux-x64
            runner: ubuntu-latest
            artifact: dtpipe-linux-x64

          - platform: linux-arm64
            rid: linux-arm64
            runner: ubuntu-24.04-arm
            artifact: dtpipe-linux-arm64

          - platform: macos-x64
            rid: osx-x64
            runner: macos-latest
            artifact: dtpipe-macos-x64

          - platform: macos-arm64
            rid: osx-arm64
            runner: macos-latest
            artifact: dtpipe-macos-arm64

          - platform: windows-x64
            rid: win-x64
            runner: windows-latest
            artifact: dtpipe-windows-x64.exe

          - platform: windows-arm64
            rid: win-arm64
            runner: windows-latest
            artifact: dtpipe-windows-arm64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.300'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Release
        shell: bash
        run: |
          dotnet publish src/DtPipe/DtPipe.csproj -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -o ./dist/release

      - name: Prepare artifact (Unix)
        if: "!contains(matrix.platform, 'windows')"
        run: |
          if [ -f "./dist/release/DtPipe" ]; then mv ./dist/release/DtPipe ./dist/release/dtpipe; fi
          chmod +x ./dist/release/dtpipe

      - name: Prepare artifact (Windows)
        if: contains(matrix.platform, 'windows')
        shell: bash
        run: |
          if [ -f "./dist/release/DtPipe.exe" ]; then mv ./dist/release/DtPipe.exe ./dist/release/dtpipe.exe; fi

      - name: Create archive (Unix)
        if: "!contains(matrix.platform, 'windows')"
        run: |
          cd ./dist/release
          tar -czf ${{ matrix.artifact }}.tar.gz dtpipe

      - name: Create archive (Windows)
        if: contains(matrix.platform, 'windows')
        shell: pwsh
        run: |
          cd ./dist/release
          Compress-Archive -Path dtpipe.exe -DestinationPath ${{ matrix.artifact }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ./dist/release/*.tar.gz
            ./dist/release/*.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Move archives to release directory
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec mv {} release/ \;
          ls -lh release/

      - name: Determine if pre-release
        id: prerelease
        run: |
          if [[ "${{ github.ref_name }}" =~ (alpha|beta|rc) ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          generate_release_notes: true

  publish-nuget:
    name: Publish to NuGet
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.300'

      - name: Pack All Projects
        run: dotnet pack DtPipe.sln -c Release

      - name: Push to NuGet
        # Push only DtPipe.* or dtpipe.* packages, skipping duplicate versions.
        run: |
          find . -name "*.nupkg" \
            -iname "dtpipe*" \
            -exec dotnet nuget push {} --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate \;

  # The product's two images (deploy/Dockerfile): built natively on each architecture, because the Dockerfile runs the
  # dtpipe binary it builds. At a tag, or by hand with publish, they are pushed by digest and joined into one multi-arch
  # tag below; run by hand otherwise, they are only built, with the commit the run is on as their revision.
  images:
    name: Image ${{ matrix.image }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    env:
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: coordinator, arch: amd64, runner: ubuntu-latest }
          - { image: coordinator, arch: arm64, runner: ubuntu-24.04-arm }
          - { image: runner, arch: amd64, runner: ubuntu-latest }
          - { image: runner, arch: arm64, runner: ubuntu-24.04-arm }

    steps:
      - name: Check the tag to publish under
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || { echo "tag must be 1 to 128 letters, digits, '.', '_' or '-'." >&2; exit 1; }
          [[ "$TAG" == latest || "$TAG" =~ ^v?[0-9]+(\.[0-9]+){0,2}$ ]] && { echo "tag '$TAG' is a release's: only a tag push publishes those." >&2; exit 1; }
          echo "publishing under $TAG"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Name the image
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dtpipe-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.image }}
          platforms: linux/${{ matrix.arch }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Keep the digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p digests
          touch "digests/$(echo '${{ steps.push.outputs.digest }}' | cut -d: -f2)"

      - name: Upload the digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

      - name: Build and load
        if: env.PUBLISH != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.image }}
          platforms: linux/${{ matrix.arch }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: dtpipe-${{ matrix.image }}:${{ matrix.arch }}
          load: true

      - name: Read the revision label
        if: env.PUBLISH != 'true'
        run: |
          revision=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "dtpipe-${{ matrix.image }}:${{ matrix.arch }}")
          echo "revision label: $revision"
          [ "$revision" = "${{ github.sha }}" ]
          docker save "dtpipe-${{ matrix.image }}:${{ matrix.arch }}" | gzip > "dtpipe-${{ matrix.image }}-${{ matrix.arch }}.tar.gz"

      - name: Upload the image
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.image }}-${{ matrix.arch }}
          path: dtpipe-${{ matrix.image }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  # One tag per image over both architectures: the version, its major.minor and latest. A pre-release (alpha, beta, rc)
  # gets its version tag only, and a run by hand gets the one tag it was given.
  images-tag:
    name: Tag the images
    if: github.event_name == 'push' || inputs.publish
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join the architectures
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#v}"
            tags=("$version")
            if [[ ! "$version" =~ (alpha|beta|rc) ]]; then
              tags+=("${version%.*}" latest)
            fi
          else
            version="$INPUT_TAG"
            tags=("$version")
          fi
          for image in coordinator runner; do
            name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dtpipe-$image"
            sources=()
            for digest in "digests/digest-$image-"*/*; do sources+=("$name@sha256:$(basename "$digest")"); done
            args=()
            for tag in "${tags[@]}"; do args+=(-t "$name:$tag"); done
            docker buildx imagetools create "${args[@]}" \
              --annotation "index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              "${sources[@]}"
            docker buildx imagetools inspect "$name:$version"
          done
