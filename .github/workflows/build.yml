name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:


jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.300'

      - name: Check C# formatting
        run: bash tests/scripts/format_csharp.sh --verify

      - name: Restore dependencies
        run: dotnet restore

      - name: Run Tests (Unit only)
        run: dotnet test --no-restore --verbosity normal --filter "FullyQualifiedName!~Integration"

  validators:
    name: Validators (no infrastructure)
    needs: test
    runs-on: ubuntu-latest
    # The shell validators enforce rules the unit suites cannot: the Core boundary, the DAG
    # channel endpoints, exit code 130 on interrupt. They used to run only if someone
    # remembered to, and eleven of them had silently stopped running at all.
    #
    # Which ones can run here is derived, never listed: a script that needs a database sources
    # tests/scripts/lib/test_connections.sh, so sourcing it is the declaration of that need.
    # A new validator is picked up by adding the file, and excluded by the same line that gives
    # it a connection string. Databases stay local — free runners cannot host Oracle or SQL
    # Server, and validate_xml.sh writes 2.7 GB.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.300'

      - name: Build the binary under test
        run: |
          dotnet publish src/DtPipe/DtPipe.csproj -c Release \
            -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:DebugType=none -p:DebugSymbols=false \
            -o dist/release
          mv dist/release/DtPipe dist/release/dtpipe
          chmod +x dist/release/dtpipe

      - name: Run validators
        run: |
          failed=()
          for f in tests/scripts/validate_*.sh; do
            name="$(basename "$f" .sh)"
            # vitals runs the whole battery itself; xml writes 2.7 GB.
            case "$name" in validate_vitals|validate_xml) continue ;; esac
            grep -q 'lib/test_connections.sh' "$f" && continue

            echo "::group::$name"
            if bash "$f"; then echo "PASS $name"; else echo "FAIL $name"; failed+=("$name"); fi
            echo "::endgroup::"
          done

          if [ ${#failed[@]} -gt 0 ]; then
            echo "Failed: ${failed[*]}"
            exit 1
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            rid: linux-x64
            runner: ubuntu-latest
            artifact: dtpipe-linux-x64

          - platform: linux-arm64
            rid: linux-arm64
            runner: ubuntu-24.04-arm
            artifact: dtpipe-linux-arm64

          - platform: macos-x64
            rid: osx-x64
            runner: macos-latest
            artifact: dtpipe-macos-x64

          - platform: macos-arm64
            rid: osx-arm64
            runner: macos-latest
            artifact: dtpipe-macos-arm64

          - platform: windows-x64
            rid: win-x64
            runner: windows-latest
            artifact: dtpipe-windows-x64.exe

          - platform: windows-arm64
            rid: win-arm64
            runner: windows-latest
            artifact: dtpipe-windows-arm64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.300'


      - name: Restore dependencies
        run: dotnet restore

      - name: Build Release
        shell: bash
        run: |
          dotnet publish src/DtPipe/DtPipe.csproj -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -o ./dist/release

      - name: Prepare artifact (Unix)
        if: "!contains(matrix.platform, 'windows')"
        run: |
          if [ -f "./dist/release/DtPipe" ]; then mv ./dist/release/DtPipe ./dist/release/dtpipe; fi
          chmod +x ./dist/release/dtpipe

      - name: Prepare artifact (Windows)
        if: contains(matrix.platform, 'windows')
        shell: bash
        run: |
          if [ -f "./dist/release/DtPipe.exe" ]; then mv ./dist/release/DtPipe.exe ./dist/release/dtpipe.exe; fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ./dist/release/
          if-no-files-found: error

  release:
    name: Create Release Archives
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Create Release Archives
        run: |
          cd artifacts
          for dir in */; do
            artifact_name="${dir%/}"
            cd "$dir"
            if [[ "$artifact_name" == *"windows"* ]]; then
              zip "../${artifact_name}.zip" *
            else
              tar -czf "../${artifact_name}.tar.gz" *
            fi
            cd ..
          done
          cd ..
          ls -lh artifacts/*.{tar.gz,zip} 2>/dev/null || true

      - name: Upload Release Assets
        uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: |
            artifacts/*.tar.gz
            artifacts/*.zip
