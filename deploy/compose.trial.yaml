# The trial recipe with everything in Docker: deploy/compose.yaml, plus a data node of the kind a team writes
# (DtPipe.PipelineNode.Hosting), a scheduler's identity, the matrix between the node and the runner, and the library that
# names the node. The node offers two bricks, a generated source and a file sink, and holds no database; the runner carries
# the step between them. The `keys` service writes their keys too, and the coordinator adds both identities from them.
# NOT FOR PRODUCTION: see deploy/compose.yaml.
#
#   docker compose -f deploy/compose.yaml -f deploy/compose.trial.yaml up --build --wait
#
# The node is always built from this checkout: it is a stand-in for a team's own service, and nothing publishes it.

services:
  keys:
    environment:
      DTPIPE_KEYS: admin runner-1 trial-node launcher-1
    volumes:
      - trial-node-key:/keys/trial-node

  coordinator:
    environment:
      Coordinator__RightsSeed: /trial/rights.json
      Coordinator__Bootstrap__Identities__1__Id: trial-node
      Coordinator__Bootstrap__Identities__1__Name: trial-node
      Coordinator__Bootstrap__Identities__1__Groups__0: trial
      Coordinator__Bootstrap__Identities__1__Key: "@/secrets/trial-node.key"
      Coordinator__Bootstrap__Identities__2__Id: launcher-1
      Coordinator__Bootstrap__Identities__2__Name: launcher-1
      Coordinator__Bootstrap__Identities__2__Kind: launcher
      Coordinator__Bootstrap__Identities__2__Pipelines__0: trial-totals
      Coordinator__Bootstrap__Identities__2__Key: "@/secrets/launcher-1.key"
    volumes:
      - ./trial/docker-node/rights.json:/trial/rights.json:ro
      - ./trial/docker-node/library:/trial/library:ro

  node:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: trial-node
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-}
    init: true
    environment:
      DtPipeNode__Name: trial-node
      DtPipeNode__Description: Trial data node
      DtPipeNode__CoordinatorUrl: http://coordinator:8080
      DtPipeNode__Oidc__ClientSecret: "@/secrets/trial-node.key"
      DtPipeNode__BricksFile: /etc/trial-node/bricks.json
    volumes:
      - ./trial/docker-node/node-bricks.json:/etc/trial-node/bricks.json:ro
      - node-state:/state
      - trial-node-key:/secrets:ro
    depends_on:
      coordinator: { condition: service_healthy }

volumes:
  node-state:
  trial-node-key:
