# The distributed pipeline's trial recipe: a coordinator (which is its own trial identity provider), its Redis and a runner. It
# starts with no rights: docs/guides/distributed-first-pipeline.md declares them in Access and adds a node of its own. For a
# recipe that runs in Docker alone, add deploy/compose.trial.yaml.
# NOT FOR PRODUCTION: the identity provider is a stand-in with one shared password, written in this file, and nothing here is
# behind TLS. See deploy/README.md for what a real deployment provides.
#
#   docker compose -f deploy/compose.yaml up --wait
#   docker compose -f deploy/compose.yaml -f deploy/compose.trial.yaml up --build --wait
#
# DTPIPE_VERSION picks the published images (default: latest); DTPIPE_COORDINATOR_IMAGE and DTPIPE_RUNNER_IMAGE
# replace them whole, for images built from a checkout.
#
# One issuer: a token names the address of the identity provider that signed it, so browsers and services must reach
# it at that same address. coordinator.localtest.me resolves to 127.0.0.1 on the host and, by the network alias, to the
# coordinator in the containers; the coordinator listens on 8080 in the container and on the host, so the port is part
# of the address everywhere.

x-trial-password: &password dtpipe-trial-password

name: dtpipe-trial

services:
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --appendfsync always
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  coordinator:
    image: ${DTPIPE_COORDINATOR_IMAGE:-ghcr.io/nicopon/dtpipe-coordinator:${DTPIPE_VERSION:-latest}}
    init: true
    ports: ["127.0.0.1:8080:8080"]
    environment:
      # A trial keeps this on: the volumes are new on the first start and the recipe is meant to be rerun after
      # `down -v`. A deployment sets it for its first start only (deploy/README.md).
      Coordinator__Initialize: "true"
      Coordinator__InsecureTrialIdp__Password: *password
      Coordinator__PublicUrl: http://coordinator.localtest.me:8080
      Coordinator__Store: redis
      Coordinator__Redis__ConnectionString: redis:6379
      Coordinator__Roles__Admin: admin@dtpipe.test
      Coordinator__LibrarySeed: /trial/library
    volumes:
      - coordinator-state:/state
      - ./trial/library:/trial/library:ro
    networks:
      default:
        aliases: [coordinator.localtest.me]
    depends_on:
      redis: { condition: service_healthy }

  runner:
    image: ${DTPIPE_RUNNER_IMAGE:-ghcr.io/nicopon/dtpipe-runner:${DTPIPE_VERSION:-latest}}
    init: true
    environment:
      DtPipeNode__Name: runner-1
      DtPipeNode__Description: Runner
      DtPipeNode__CoordinatorUrl: http://coordinator:8080
      DtPipeNode__Oidc__ClientSecret: *password
    volumes:
      - runner-state:/state
    depends_on:
      coordinator: { condition: service_healthy }

volumes:
  redis-data:
  coordinator-state:
  runner-state:
