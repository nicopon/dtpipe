# The distributed pipeline's trial recipe: a coordinator, its Redis and a runner, every identity verified by a key the
# coordinator issues tokens for. On the first `up`, the one-off `keys` service writes a random key for the first administrator
# and one for the runner; the coordinator adds both identities from them, and the runner reads its own. Nothing else is in the
# rights: docs/guides/distributed-first-pipeline.md adds a node in Access. For a recipe that runs in Docker alone, add
# deploy/compose.trial.yaml.
# NOT FOR PRODUCTION: nothing here is behind TLS, so a key crosses the network in clear at every token request
# (Coordinator__Auth__AllowHttpKeys, which every page names). See deploy/README.md for what a real deployment provides.
#
#   docker compose -f deploy/compose.yaml up --wait
#   docker compose -f deploy/compose.yaml exec coordinator cat /secrets/admin.key
#   docker compose -f deploy/compose.yaml -f deploy/compose.trial.yaml up --build --wait
#
# DTPIPE_VERSION picks the published images (default: latest); DTPIPE_COORDINATOR_IMAGE and DTPIPE_RUNNER_IMAGE
# replace them whole, for images built from a checkout.
#
# One issuer: a token names the address of the coordinator that signed it, so browsers and services must reach it at that
# same address. coordinator.localtest.me resolves to 127.0.0.1 on the host and, by the network alias, to the coordinator in
# the containers; the coordinator listens on 8080 in the container and on the host, so the port is part of the address
# everywhere.

name: dtpipe-trial

services:
  # Writes dtp_<id>_<43 characters of base64url> (32 random bytes) for each id of DTPIPE_KEYS that has no key yet, into the
  # coordinator's volume, and copies each into the volume mounted at /keys/<id>, the one its node reads: a runner runs
  # whatever branch a pipeline holds, so it never sees another identity's key. Root only to give the files to the images'
  # user (1654), mode 0600; it never replaces a key, so `up` again keeps them, and `down -v` makes new ones.
  keys:
    image: ${DTPIPE_RUNNER_IMAGE:-ghcr.io/nicopon/dtpipe-runner:${DTPIPE_VERSION:-latest}}
    user: "0:0"
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        umask 077
        for id in $$DTPIPE_KEYS; do
          key=/keys/coordinator/$$id.key
          if [ ! -s "$$key" ]; then
            printf 'dtp_%s_%s' "$$id" "$$(head -c 32 /dev/urandom | base64 | tr '+/' '-_' | tr -d '=\n')" > "$$key.new"
            mv "$$key.new" "$$key"
          fi
          if [ -d "/keys/$$id" ]; then cp "$$key" "/keys/$$id/$$id.key"; fi
        done
        chown -R 1654:1654 /keys
    environment:
      DTPIPE_KEYS: admin runner-1
    volumes:
      - coordinator-keys:/keys/coordinator
      - runner-key:/keys/runner-1

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --appendfsync always
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  coordinator:
    image: ${DTPIPE_COORDINATOR_IMAGE:-ghcr.io/nicopon/dtpipe-coordinator:${DTPIPE_VERSION:-latest}}
    init: true
    ports: ["127.0.0.1:8080:8080"]
    environment:
      # A trial keeps this on: the volumes are new on the first start and the recipe is meant to be rerun after
      # `down -v`. A deployment sets it for its first start only (deploy/README.md).
      Coordinator__Initialize: "true"
      Coordinator__PublicUrl: http://coordinator.localtest.me:8080
      # The recipe has no TLS: without this the coordinator refuses to exchange a key over HTTP, and nobody could sign in.
      Coordinator__Auth__AllowHttpKeys: "true"
      Coordinator__Studio__ClientId: dtpipe-studio
      Coordinator__Bootstrap__AdminKey: "@/secrets/admin.key"
      Coordinator__Bootstrap__Identities__0__Id: runner-1
      Coordinator__Bootstrap__Identities__0__Name: runner-1
      Coordinator__Bootstrap__Identities__0__Groups__0: runner
      Coordinator__Bootstrap__Identities__0__Key: "@/secrets/runner-1.key"
      Coordinator__Store: redis
      Coordinator__Redis__ConnectionString: redis:6379
      Coordinator__LibrarySeed: /trial/library
    volumes:
      - coordinator-state:/state
      - coordinator-keys:/secrets:ro
      - ./trial/library:/trial/library:ro
    networks:
      default:
        aliases: [coordinator.localtest.me]
    depends_on:
      keys: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  runner:
    image: ${DTPIPE_RUNNER_IMAGE:-ghcr.io/nicopon/dtpipe-runner:${DTPIPE_VERSION:-latest}}
    init: true
    environment:
      DtPipeNode__Name: runner-1
      DtPipeNode__Description: Runner
      # No Oidc__Authority: the node finds the coordinator's key issuer in the coordinator's metadata.
      DtPipeNode__CoordinatorUrl: http://coordinator:8080
      DtPipeNode__Oidc__ClientSecret: "@/secrets/runner-1.key"
    volumes:
      - runner-state:/state
      - runner-key:/secrets:ro
    depends_on:
      coordinator: { condition: service_healthy }

volumes:
  redis-data:
  coordinator-state:
  runner-state:
  coordinator-keys:
  runner-key:
